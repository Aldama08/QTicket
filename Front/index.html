<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tickets Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <header>
            <h1>Sistema de Tickets de Soporte</h1>
            <p id="Des">Describe tu problema y te ayudaremos.</p>
        </header>

        <main>
            <!-- <div class="message-container"></div> -->

            <form id="ticket-form">
                <div>
                    <h2>1. Describe tu problema</h2>
                    <div>
                        <div>
                            <label for="ticket-subject">Asunto</label>
                            <input type="text" id="ticket-subject" required placeholder="Ej: No puedo conectarme al WiFi">
                        </div>
                        <div>
                            <label for="ticket-description">Descripción Completa</label>
                            <textarea id="ticket-description" rows="5" required placeholder="Escribe aquí para ver posibles soluciones..."></textarea>
                        </div>
                    </div>
                </div>
                
                <div id="suggestions-container">
                    <h3>
                       <i data-lucide="lightbulb"></i>
                       Posibles Soluciones
                       <div id="suggestions-loader"></div>
                    </h3>
                    <div id="suggestions-list"></div>
                    <p>Si ninguna solución te ayuda, completa tus datos a continuación y envía tu ticket.</p>
                </div>

                <div>
                    <h2>2. Completa tus datos</h2>
                    <fieldset>
                        <legend>Soy:</legend>
                        <div>
                            <div>
                                <input id="user-type-student" name="user-type" type="radio" value="student" checked>
                                <label for="user-type-student">Alumno</label>
                            </div>
                            <div>
                                <input id="user-type-admin" name="user-type" type="radio" value="admin">
                                <label for="user-type-admin">Administrativo</label>
                            </div>
                        </div>
                    </fieldset>

                    <div id="student-form">
                        <div><label for="student-code">Código de Alumno</label><input type="text" id="student-code" required></div>
                        <div><label for="student-name">Nombre Completo</label><input type="text" id="student-name" required></div>
                        <div><label for="student-career">Carrera</label><input type="text" id="student-career" required></div>
                        <div><label for="student-email">Correo Electrónico</label><input type="email" id="student-email" required></div>
                        <div><label for="student-contact">Número de Contacto (Opcional)</label><input type="tel" id="student-contact"></div>
                    </div>

                    <div id="admin-form">
                        <div><label for="admin-code">Código de Empleado</label><input type="text" id="admin-code" required></div>
                        <div><label for="admin-name">Nombre Completo</label><input type="text" id="admin-name" required></div>
                        <div><label for="admin-department">Departamento</label><input type="text" id="admin-department" required></div>
                        <div><label for="admin-building">Edificio</label><input type="text" id="admin-building" required></div>
                        <div><label for="admin-email">Correo Electrónico</label><input type="email" id="admin-email" required></div>
                        <div><label for="admin-contact">Celular (Opcional)</label><input type="tel" id="admin-contact"></div>
                        <div><label for="admin-extension">Extensión (Opcional)</label><input type="text" id="admin-extension"></div>
                    </div>
                </div>

                <div>
                    <button type="submit" id="save-ticket-button">
                        <i data-lucide="send"></i>
                        Enviar Ticket
                    </button>
                </div>
